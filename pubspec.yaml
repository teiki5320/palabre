name: palabre
description: "Palabre — l'arbre à palabres. Sondage hebdomadaire, positionnement par rapport aux partis, gouvernement et assemblée documentés."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.3
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  timezone: ^0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  generate: true
  # Plugins iOS via CocoaPods uniquement : Xcode Cloud exige sinon un
  # Package.resolved commité pour le package Swift généré par Flutter.
  disable-swift-package-manager: true

