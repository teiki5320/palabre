name: president
description: "Président pour 100 jours — jeu de cartes à glisser."
publish_to: none
version: 0.16.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

# Icône de l'application, fabriquée depuis assets/icone/icone.png :
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icone/icone.png
  remove_alpha_ios: true
  adaptive_icon_background: "#14131A"
  adaptive_icon_foreground: assets/icone/icone.png

flutter:
  uses-material-design: true
  assets:
    - assets/contenu/
    - assets/icone/
    - assets/images/personnages/
    - assets/images/parcours/
    - assets/images/fins/
    - assets/images/palais/balcon/jour/cameras/
    - assets/images/palais/balcon/jour/defile/
    - assets/images/palais/balcon/jour/deuil/
    - assets/images/palais/balcon/jour/emeute/
    - assets/images/palais/balcon/jour/eteinte/
    - assets/images/palais/balcon/jour/liesse/
    - assets/images/palais/balcon/jour/ordinaire/
    - assets/images/palais/balcon/jour/pluies/
    - assets/images/palais/balcon/jour/prospere/
    - assets/images/palais/balcon/jour/verrouillee/
    - assets/images/palais/balcon/nuit/cameras/
    - assets/images/palais/balcon/nuit/emeute/
    - assets/images/palais/balcon/nuit/eteinte/
    - assets/images/palais/balcon/nuit/liesse/
    - assets/images/palais/balcon/nuit/ordinaire/
    - assets/images/palais/balcon/nuit/pluies/
    - assets/images/palais/balcon/nuit/prospere/
    - assets/images/palais/balcon/nuit/verrouillee/
    - assets/images/palais/pieces/
    - assets/images/palais/pieces/chambre_conjoint/redactrice/
    - assets/images/palais/pieces/piscine_quartier/
    - assets/images/palais/pieces/chambre_conjoint/cabinet/
    - assets/images/palais/pieces/chambre_conjoint/emissaire/
    - assets/images/palais/pieces/chambre_conjoint/militante/
    - assets/images/palais/pieces/chambre_conjoint/epouse/
    - assets/images/palais/pieces/chambre_conjoint/international/
    - assets/images/palais/pieces/chambre_conjoint/ministre/
    - assets/images/palais/pieces/chambre_conjoint/renseignements/
    - assets/images/palais/pieces/chambre_conjoint/maire/
    - assets/images/palais/pieces/chambre_conjoint/epoux/
    - assets/images/palais/pieces/chambre_presence/
    - assets/images/palais/pieces/chambre_lit/redactrice/
    - assets/images/palais/pieces/chambre_lit/cabinet/
    - assets/images/palais/pieces/chambre_lit/emissaire/
    - assets/images/palais/pieces/chambre_lit/militante/
    - assets/images/palais/pieces/chambre_lit/epouse/
    - assets/images/palais/pieces/chambre_lit/international/
    - assets/images/palais/pieces/chambre_lit/ministre/
    - assets/images/palais/pieces/chambre_lit/renseignements/
    - assets/images/palais/pieces/chambre_lit/maire/
    - assets/images/palais/pieces/chambre_lit/epoux/
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/polices/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/polices/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: PublicSans
      fonts:
        - asset: assets/polices/PublicSans-Regular.ttf
          weight: 400
        - asset: assets/polices/PublicSans-SemiBold.ttf
          weight: 600
        - asset: assets/polices/PublicSans-Bold.ttf
          weight: 700
