name: president
description: "Président pour 100 jours — jeu de cartes à glisser."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

# Icône de l'application, fabriquée depuis assets/icone/icone.png :
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icone/icone.png
  remove_alpha_ios: true
  adaptive_icon_background: "#14131A"
  adaptive_icon_foreground: assets/icone/icone.png

flutter:
  uses-material-design: true
  assets:
    - assets/contenu/
    - assets/images/personnages/
    - assets/images/fins/
