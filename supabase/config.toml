# Configuration Supabase locale — Palabre
project_id = "palabre"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "palabre://auth"
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
# Auth anonyme au démarrage, e-mail optionnel ensuite (section 2).
enable_anonymous_sign_ins = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.rate_limit]
anonymous_users = 30

[edge_runtime]
enabled = true
policy = "oneshot"

[analytics]
enabled = false
