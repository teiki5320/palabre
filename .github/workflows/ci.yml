name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema:
    name: Schéma Supabase
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Créer la base
        run: psql postgresql://postgres:postgres@localhost:5432/postgres -c 'create database palabre_check'
      - name: Migrations, seed, tests
        env:
          PGURL: postgresql://postgres:postgres@localhost:5432/palabre_check
        run: scripts/db_check.sh

  question-semaine:
    name: Question de la semaine (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_controles
        working-directory: scripts/question_semaine
      - name: Pipeline hors ligne sur une fixture
        run: |
          python scripts/question_semaine/run.py --sujets scripts/question_semaine/fixture_bj.json --pays BJ --semaine 2026-09-21 --jour 2026-09-12 --sortie /tmp/qs
          python -c "import json,sys; r=json.load(open('/tmp/qs/rapport.json'))['resultats'][0]; sys.exit(0 if r['statut']=='publie' else 'la fixture devrait donner un sujet retenu : '+r.get('raison',''))"

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      - name: APK release (taille)
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols --dart-define=SUPABASE_URL= --dart-define=SUPABASE_ANON_KEY=
          ls -la build/app/outputs/flutter-apk/*.apk
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            size=$(stat -c %s "$f")
            if [ "$size" -gt 15728640 ]; then echo "$f dépasse 15 Mo ($size octets)"; exit 1; fi
          done
